name: Condo CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. ต้องลง Node.js ก่อนมึง!
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. ลง Dependencies ของ Frontend ก่อนรันเทส
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
          npx playwright install --with-deps chromium # บรรทัดนี้สำคัญมาก!

      - name: Build Backend Image
        run: docker build -t condo-backend ./backend

      - name: Build Frontend Image
        run: docker build -t condo-frontend ./frontend
        
      - name: Test Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Run Playwright Tests
        run: |
          cd frontend
          npm run test:all